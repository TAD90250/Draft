<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>2026 Fantasy Football Cheat Sheets</title>
<style>
  body{
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    background:#0f1115; color:#eee; margin:0;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; box-sizing:border-box;
  }
  .wrap{max-width:480px; width:100%;}
  h1{font-size:22px; margin-bottom:4px; text-align:center;}
  .sub{color:#9aa0a6; font-size:13px; text-align:center; margin-bottom:32px;}
  .card{
    display:block; text-decoration:none; color:#eee;
    background:#181b21; border:1px solid #2a2e37; border-radius:10px;
    padding:20px 22px; margin-bottom:16px; transition:border-color .15s, background .15s;
  }
  .card:hover{border-color:#4a90d9; background:#1c2027;}
  .card h2{margin:0 0 4px 0; font-size:17px;}
  .card p{margin:0; color:#9aa0a6; font-size:13px; line-height:1.4;}
  .tag{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.04em; padding:2px 8px; border-radius:4px; margin-bottom:8px;
  }
  .tag.ppr{background:#2b7fd6; color:#0f1115;}
  .tag.half{background:#5fd97a; color:#0f1115;}
</style></head>
<body>
<div class="wrap">
  <h1>2026 Redraft Cheat Sheets</h1>
  <div class="sub">Pick a scoring format to open its board</div>

  <a class="card" href="ppr_cheat_sheet.html">
    <span class="tag ppr">Full PPR</span>
    <h2>12-Team PPR</h2>
    <p>200 players, Claude-built tiers and ranking order. 1 point per reception.</p>
  </a>

  <a class="card" href="half_ppr_cheat_sheet.html">
    <span class="tag half">Half PPR</span>
    <h2>12-Team Half-PPR</h2>
    <p>250 players, rankings and tiers pulled from your consensus Google Sheet. 0.5 points per reception.</p>
  </a>
</div>
</body></html>
